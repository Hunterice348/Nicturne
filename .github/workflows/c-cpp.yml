name: HUNTERICE VST3 Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  PROJECT_NAME: HUNTERICE_SYNTH

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}
    - name: Build
      run: cmake --build build --config ${{env.BUILD_TYPE}} --target ${{env.PROJECT_NAME}}_VST3 --parallel
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        name: HUNTERICE-SYNTH-VST3
        path: build/HUNTERICE_SYNTH_artefacts/${{env.BUILD_TYPE}}/VST3/
